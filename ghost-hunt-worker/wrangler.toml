name = "ghost-hunt"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "ghost-hunt"
database_id = "ceb964e8-72b2-4ad7-acf6-43a4529ad38d"

[vars]
# Storefront used to read the product/collection pool (public /products.json, /collections.json).
SHOP_URL = "https://effect-expert.myshopify.com"
# Comma-separated. "*.domain" allows any https subdomain.
ALLOWED_ORIGINS = "https://effect-expert.com,https://www.effect-expert.com,https://effect-expert.myshopify.com,*.shopifypreview.com"
# How often the ghosts move. 24 = once a day.
SHUFFLE_HOURS = "24"
# Shuffle at local midnight: Kyiv is +180 (summer) / +120 (winter).
SHUFFLE_TZ_OFFSET_MIN = "120"
# Where the 5 white ghosts go. Total must equal the length of SECRET_CODE.
# Entries: type[@category|category][:count]; type = home | collection (category page) | product.
DISTRIBUTION = "collection@rozhidnyky,collection@eyelashes,collection@glue,collection@pre-care,product@rozhidnyky|eyelashes|glue|pre-care"
# Optional collection handle limiting which products can get a ghost (falls back to all products).
POOL_COLLECTION = "ghost-hunt-pool"
# Collection handles that never get a ghost.
EXCLUDE_COLLECTIONS = ""
# ISO dates (Kyiv time shown as +02:00/+03:00). Empty = always on.
CAMPAIGN_START = "2026-10-28T00:00:00+02:00"
CAMPAIGN_END = "2026-10-31T23:59:59+02:00"
# When the golden ghost appears (and the popup switches to its golden version). Empty = from campaign start.
GOLDEN_START = "2026-10-31T00:00:00+02:00"
# Fields the golden ghost form must send.
GOLDEN_REQUIRED = "name,phone,email"

# Secrets: set with `npx wrangler secret put NAME` (for local dev, put them in .dev.vars):
#   SECRET_CODE        5 digits, ghost N shows digit N
#   DISCOUNT_CODE      Shopify discount code revealed for the correct code
#   LAYOUT_SALT        any random string; changing it reshuffles everything
#   DEBUG_KEY          key used in ?ghosthunt=<DEBUG_KEY> for internal testing
#   ADMIN_TOKEN        for GET /admin (winner + stats)
#   TELEGRAM_BOT_TOKEN optional, golden ghost alert
#   TELEGRAM_CHAT_ID   optional
